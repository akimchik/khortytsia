name: Khortytsia CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package-and-upload:
    uses: ./.github/workflows/package_and_upload.yml
    secrets: inherit

  test-and-deploy:
    needs: package-and-upload
    runs-on: ubuntu-latest
    env:
      TF_VAR_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_EMAIL_FROM: ${{ secrets.TF_VAR_EMAIL_FROM }}
      TF_VAR_EMAIL_TO: ${{ secrets.TF_VAR_EMAIL_TO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.2.5

      - name: Run All Unit & Security Tests
        uses: ./.github/actions/run-all-tests

      - name: Terraform Init
        run: terraform init -reconfigure -input=false
        working-directory: ./pipeline



      - name: Terraform Apply
        id: deploy_infra
        run: |
          cd pipeline
          terraform apply -auto-approve -input=false
