name: Import Existing Infrastructure

on:
  workflow_dispatch:

jobs:
  import-state:
    runs-on: ubuntu-latest
    env:
      TF_VAR_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_EMAIL_TO: ${{ secrets.TF_VAR_EMAIL_TO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.2.5

      - name: Terraform Init
        id: init
        run: |
          cd pipeline
          terraform init -reconfigure

      - name: Import Resources
        id: import
        run: |
          cd pipeline
          # Import storage buckets
          terraform import module.storage.google_storage_bucket.source_bucket ${{ secrets.GCP_PROJECT_ID }}-source-code || echo "Source bucket already imported or does not exist"
          terraform import module.storage.google_storage_bucket.keywords_bucket $(terraform output -raw keywords_bucket_name) || echo "Keywords bucket already imported or does not exist"

          # Import BigQuery dataset and table
          terraform import module.bigquery.google_bigquery_dataset.results_dataset ${{ secrets.GCP_PROJECT_ID }}:khortytsia_results || echo "BigQuery dataset already imported or does not exist"
          terraform import module.bigquery.google_bigquery_table.approved_leads ${{ secrets.GCP_PROJECT_ID }}:khortytsia_results.approved_leads || echo "BigQuery table already imported or does not exist"

          # Import monitoring resources
          terraform import module.monitoring.google_logging_metric.metric manual_review_required_metric || echo "Logging metric already imported or does not exist"
          terraform import module.monitoring.google_monitoring_notification_channel.email_channel ${{ secrets.EMAIL_TO }} || echo "Notification channel already imported or does not exist"

          # Import Pub/Sub topics
          for topic in $(gcloud pubsub topics list --format='value(name)' --filter='name:projects/${{ secrets.GCP_PROJECT_ID }}/topics/'); do
            topic_name=$(basename $topic)
            terraform import module.pubsub.google_pubsub_topic.topics["$topic_name"] $topic_name || echo "Topic $topic_name already imported or does not exist"
          done

          # Import service accounts
          terraform import google_service_account.khortytsia_workflow_sa projects/${{ secrets.GCP_PROJECT_ID }}/serviceAccounts/khortytsia-workflow-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com || echo "Workflow service account already imported or does not exist"